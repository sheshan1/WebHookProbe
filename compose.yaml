name: webhookprobe
services:
  db:
    profiles: [demo]
    image: postgres:18
    environment:
      POSTGRES_DB: webhookprobe
      POSTGRES_USER: ${POSTGRES_USER:-webhookprobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhookprobe-local}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d webhookprobe"]
      interval: 3s
      timeout: 3s
      retries: 20
  receiver:
    profiles: [demo]
    build: ./receiver
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/webhookprobe
      POSTGRES_USER: ${POSTGRES_USER:-webhookprobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhookprobe-local}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  runner:
    build: ./runner
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${UI_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      runner:
        condition: service_healthy
volumes:
  pgdata:
