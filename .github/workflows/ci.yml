name: WebHookProbe checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: webhookprobe
          POSTGRES_PASSWORD: webhookprobe-local
          POSTGRES_DB: webhookprobe
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U webhookprobe -d webhookprobe"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: bash scripts/check.sh
        env:
          RUN_RECEIVER_IT: "true"
      - run: |
          java -jar receiver/target/receiver-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo > /tmp/receiver.log 2>&1 &
          python3 scripts/sample_receiver.py > /tmp/fixture.log 2>&1 &
          cd runner
          go build -o /tmp/webhookprobe ./cmd/webhookprobe
          /tmp/webhookprobe serve > /tmp/runner.log 2>&1 &
      - run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness; then exit 0; fi
            sleep 1
          done
          cat /tmp/receiver.log
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          TEST_FIXTURE_URL: http://127.0.0.1:8090
      - run: docker compose --profile demo -f compose.yaml -f compose.samples.yaml build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            frontend/test-results/
            receiver/target/surefire-reports/
