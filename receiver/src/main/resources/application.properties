spring.application.name=WebHookProbeReceiver
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/webhookprobe}
spring.datasource.username=${POSTGRES_USER:webhookprobe}
spring.datasource.password=${POSTGRES_PASSWORD:webhookprobe-local}
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.flyway.clean-disabled=true
webhookprobe.demo.enabled=${DEMO_ENABLED:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,demo
logging.structured.format.console=ecs

logging.level.org.springframework=INFO
